# Shared build tooling from jmerhar/devtools, fetched into .devtools/ by bin/devtools-fetch.sh.
[fetch]
ref = "v1"
files = [
  "make/devtools.mk",
  "bin/ci.py",
  "bin/pages-artifact.sh",
  "bin/devtools-check.py",
  "fetch/devtools-fetch.sh",
  "make/npm.mk",
  "bin/npm-ci.sh",
  "bin/lockfile.sh",
  "bin/check-lockfile.sh",
]
coverage = true

# The app, whose lockfile resolves only to the public registry (`make lockfile`).
[npm]
dirs = ["."]

# CI, run by jmerhar/devtools' python-docker-app.yml (.github/workflows/ci.yml).
[ci]
node = "24"
junit = ["junit/vitest.xml"]
coverage_description = "App HTML coverage report"
github_release = false

[[ci.suite]]
name = "app"
node = true
install = "npm ci"
run = "npm run lint && npm run typecheck && npx vitest run --coverage && npm run build"
coverage = ["coverage", "junit"]

[[ci.suite]]
name = "devtools"
run = "python3 .devtools/bin/devtools-check.py"

# .github/dependabot.yml, generated from these by `make devtools-fix`: GitHub Actions, then each
# update below. Each takes a release once it is three days old, in one weekly pull request of minor
# and patch releases and another of majors, which waits for a hand migration.
[[dependabot.update]]
ecosystem = "npm"
directory = "/"
group = "npm"

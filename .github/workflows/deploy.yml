name: Deploy to GitHub Pages

# The production build, deployed by jmerhar/devtools' shared Pages workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pages:
    uses: jmerhar/devtools/.github/workflows/pages-deploy.yml@v1
    with:
      node: "22"
      install: npm ci
      build: npm run build
      path: dist
    permissions:
      contents: read
      pages: write
      id-token: write

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="Calculate Portuguese property-transfer tax (IMT) and stamp duty for a purchase in 2026, including the non-resident rules under Decreto-Lei n.º 97/2026."
    />
    <!-- Self-hosted fonts (see src/styles/fonts.css); preload the two above-the-fold faces (body
         text + display heading) so they don't gate LCP. Mono loads on demand. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Default title for the initial load and crawlers; the app sets a per-route title once mounted. -->
    <title>IMT Calculator · Portugal · 2026</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7SNXFN63ZN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Only configure a destination off localhost, so `npm run dev` never sends events to the
      // live property. gtag() still exists in dev (the app calls it), it just has nowhere to send.
      // Page views are sent per route by the app, so disable the automatic one.
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        gtag("config", "G-7SNXFN63ZN", { send_page_view: false });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

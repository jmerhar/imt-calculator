<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved/OS theme before first paint so there is no flash of the default (light)
         theme on load. Mirrors initialTheme() in src/theme/theme.tsx. The attribute lives on <html>,
         outside React's root, so it never causes a hydration mismatch. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("imt-theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Tint the mobile browser UI to match the page background per color scheme. -->
    <meta name="theme-color" content="#f7f4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1a2b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Calculate Portuguese property-transfer tax (IMT) and stamp duty for a purchase in 2026, including the non-resident rules under Decreto-Lei n.º 97/2026."
    />
    <!-- Self-hosted fonts (src/styles/fonts.css). The display + body faces use font-display: block
         so a fallback typeface is never shown; preload them so the invisible window before the
         brand font paints stays as short as possible. Mono (result figures) uses swap and loads on
         demand. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Default title for the initial load and crawlers; the app sets a per-route title once mounted. -->
    <title>IMT Calculator · Portugal · 2026</title>

    <!-- Google Analytics (gtag.js). The inline stub defines the event queue synchronously so the
         app can push events from first render; the heavy gtag.js script is fetched only once the
         page is idle, so it never competes for the main thread or bandwidth during initial render.
         Queued events flush when it arrives. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Only configure a destination off localhost, so `npm run dev` never sends events to the
      // live property. gtag() still exists in dev (the app calls it), it just has nowhere to send.
      // Page views are sent per route by the app, so disable the automatic one.
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        gtag("config", "G-7SNXFN63ZN", { send_page_view: false });
        var loadGtag = function () {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-7SNXFN63ZN";
          document.head.appendChild(s);
        };
        if ("requestIdleCallback" in window) requestIdleCallback(loadGtag, { timeout: 3000 });
        else window.addEventListener("load", loadGtag);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
